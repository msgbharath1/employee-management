openapi: 3.0.3

info:
  title: Employee Management API
  version: 1.0.0
  description: Employee CRUD REST API built with Spring Boot

servers:
  - url: http://localhost:8080

paths:

  /employees:

    get:
      summary: Get All Employees
      operationId: getEmployees

      responses:
        '200':
          description: Employees returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'

        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create Employee
      operationId: createEmployee

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'

      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /employees/{id}:

    get:
      summary: Get Employee By Id
      operationId: getEmployee

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Employee found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'

        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update Employee By Id
      operationId: updateEmployee

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'

      responses:
        '200':
          description: Employee Update successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
        '404':
          description: Employee Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'
    delete:
      summary: Delete Employee
      operationId: deleteEmployee

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Employee deleted

        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:

  schemas:

    Employee:
      type: object
      required:
        - id
        - name
        - email

      properties:
        id:
          type: integer
          format: int64
          example: 1001

        name:
          type: string
          example: Bharath Sundaresan

        email:
          type: string
          format: email
          example: bharath_sundaresan@gmail.com

    EmployeeResponse:
      type: object

      properties:
        id:
          type: integer
          format: int64

        name:
          type: string

        email:
          type: string

    EmployeeListResponse:
      type: array
      items:
        $ref: '#/components/schemas/EmployeeResponse'

    ErrorResponse:
      type: object

      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-11-17T15:30:00Z"

        status:
          type: integer
          example: 404

        error:
          type: string
          example: Employee not found

        path:
          type: string
          example: /employees/1001